name: Qualité et sécurité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel · PHP 8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip, mbstring, fileinfo
          coverage: none
          tools: composer:v2

      - name: Valider Composer
        run: composer validate --strict

      - name: Installer les dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l’environnement de test
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Vérifier les prérequis PHP
        run: composer check-platform-reqs

      - name: Rechercher les vulnérabilités PHP
        run: composer audit --locked --no-dev

      - name: Exécuter les tests Laravel
        run: php artisan test

  frontend:
    name: Front-end · Node.js 20
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Rechercher les vulnérabilités de production
        run: npm audit --omit=dev --audit-level=high

      - name: Compiler les ressources
        run: npm run build
