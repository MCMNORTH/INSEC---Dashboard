name: Qualité et sécurité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Firebase · Functions et règles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer Java (émulateurs Firebase)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Firebase CLI
        run: npm install --global firebase-tools

      - name: Installer les dépendances des Cloud Functions
        run: npm ci

      - name: Rechercher les vulnérabilités de production
        run: npm audit --omit=dev --audit-level=high

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler les Cloud Functions
        run: npm run build

      - name: Rendre le tsconfig Vue racine disponible aux tests
        run: |
          mkdir -p ../node_modules/@vue
          cp -R node_modules/@vue/tsconfig ../node_modules/@vue/tsconfig

      - name: Tester les fonctions et les règles de sécurité (émulateurs)
        run: npm test

  frontend:
    name: Front-end · Node.js 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Rechercher les vulnérabilités de production
        run: npm audit --omit=dev --audit-level=high

      - name: Vérifier les types et compiler
        run: npm run build

